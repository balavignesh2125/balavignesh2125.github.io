<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GNC Portfolio</title>

  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: white;
      font-family: Arial;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #8b949e;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .tag {
      color: #8b949e;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Aerospace GNC Portfolio</h1>
    <p>Guidance, Navigation & Control | Spacecraft Dynamics | Simulation</p>

    <img src="AttitudeControl.gif" width="100%">

    <div class="grid">

      <a class="card" href="https://github.com/balavignesh2125/balavignesh.github.io">
        <h3>Mars AOCS Simulation</h3>
        <p class="tag">MRP-based attitude control with 3-mode switching</p>
      </a>

      <a class="card" href="#">
        <h3>Coming Soon</h3>
        <p class="tag">Rover Navigation System</p>
      </a>

      <a class="card" href="#">
        <h3>Coming Soon</h3>
        <p class="tag">Rocket TVC Control</p>
      </a>

    </div>

  </div>
</body>
</html>
